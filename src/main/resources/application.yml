spring:
  time-zone: Asia/Seoul

  base-url: "https://${DOMAIN}"
  redirect-url: "${REDIRECT_URL}"

  profiles:
    include:
      - db
      - security

  mail:
    host: smtp.gmail.com
    port: 587
    username: "${MAIL_USERNAME}"
    password: "${MAIL_PASSWORD}"
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

server:
  ssl:
    key-store: "${KEY_STORE}"
    key-store-type: "${KEY_STORE_TYPE}"
    key-store-password: "${KEY_STORE_PASS}"
  port: 443

chatgpt:
  api-key: "${CHAT_GPT_KEY}"

flux:
  api:
    url: https://api.bfl.ai
    key: "${FLUX_KEY}"

runway:
  api:
    key: "${RUNWAY_KEY}"
